name: weather-grid

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build weather.json
        run: python scripts/weather_build.py api/weather.json

      - name: commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/weather.json
          git diff --staged --quiet || git commit -m "weather: update grid [skip ci]"
          git push
